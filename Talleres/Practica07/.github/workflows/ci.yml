name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Go/Fiber backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: multicatalogo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DATABASE_URL: postgres://admin:secret@localhost:5433/multicatalogo_test?sslmode=disable
      REDIS_URL: localhost:6379
      JWT_SECRET: ci_super_secret_at_least_32_bytes_long_xxxx
      ALLOWED_ORIGINS: http://localhost:5173
      APP_ENV: dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: make install
      - run: make vet
      - run: make build
      # Sin este paso los tests que pegan contra Postgres se saltaban en
      # silencio (la base del servicio está vacía) y la suite pasaba en verde
      # sin haber probado una sola consulta real.
      - name: Aplicar migraciones en la base de test
        run: |
          for f in ../database/migrations/*.sql; do
            echo "→ aplicando $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - run: make test
        env:
          TEST_DATABASE_URL: postgres://admin:secret@localhost:5433/multicatalogo_test?sslmode=disable
      - name: Instalar govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: make vuln
        env:
          PATH: ${{ env.PATH }}:$HOME/go/bin

  frontend:
    name: React/Vite frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # El lockfile canónico del frontend es pnpm-lock.yaml. Este job usaba
      # `npm ci || npm install`: sin package-lock.json el `npm ci` falla, cae
      # al `npm install`, genera un lock nuevo desde cero e instala versiones
      # que nadie probó — un CI verde que no reproduce el bug. Y
      # `cache-dependency-path: frontend/package-lock.json` apuntaba a un
      # archivo inexistente, lo que hace fallar setup-node.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: make install
      - run: make lint
      - run: make typecheck
      # Los tests del frontend no se ejecutaban en CI: se escribieron 69 y el
      # job se saltaba de lint a build.
      - run: make test
      - run: make build
      - name: Audit de dependencias
        run: make audit